name: Validate AMANAH website

on:
  pull_request:
    branches:
      - main
      - feature/pos-accounting-operations
  push:
    branches:
      - feature/distributor-dashboard-upgrade
      - feature/unilevel-multi-role-access
      - feature/admin-dashboard-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
